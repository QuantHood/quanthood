  <circle cx="1330" cy="120" r="24" fill="none" stroke="#b8ff29" stroke-width="3"/>
  <circle cx="1330" cy="120" r="9" fill="#b8ff29"/>
  <text x="100" y="245" font-family="monospace" font-size="92" font-weight="bold" fill="#f2f5f0" letter-spacing="6">QUANTHOOD</text>
  <text x="104" y="310" font-family="monospace" font-size="30" fill="#9aa79b" letter-spacing="2">THE QUANTUM CANARY · PROVEN ON-CHAIN</text>
  <text x="104" y="368" font-family="monospace" font-size="24" fill="#b8ff29" letter-spacing="1">12 KEYS · 16→192 BIT · BOUNTIES PAID ON PROOF · ROBINHOOD CHAIN</text>
  <rect x="0" y="0" width="1500" height="500" fill="none" stroke="#1a231c" stroke-width="2"/>
